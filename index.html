<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Task Manager</h1>
        <p>Manage your tasks using a REST API</p>
    </header>

    <main>

        <section class="task-form">
            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button id="addTaskBtn">
                Add Task
            </button>
        </section>

        <section>
            <h2>Task List</h2>

            <p id="loading">Loading tasks...</p>

            <ul id="taskList"></ul>
        </section>

    </main>

    <footer>
        <p>Task Manager Capstone Project</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
